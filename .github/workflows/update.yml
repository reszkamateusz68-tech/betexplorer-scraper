name: StatLab Analytics Engine

on:
  schedule:
    - cron: '0 8,14 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: 1a. Pobieranie bazy kursów (Superbet Dziś)
        run: python pobierz_superbet_dzis.py
        continue-on-error: true

      - name: 1b. Pobieranie bazy kursów (Superbet Jutro)
        run: python pobierz_superbet_jutro.py
        continue-on-error: true

      - name: 1c. Pobieranie bazy kursów (Superbet Pojutrze)
        run: python pobierz_superbet_pojutrze.py
        continue-on-error: true

      - name: 2. Silnik Analityczny (Modele, AKO, integracja kursów)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python betexplorer_all.py

      - name: 3. Wysyłka gotowych AKO na Telegram
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wyslij_kupon.py
