name: StatLab Analytics Engine

on:
  schedule:
    # Skrypt odpala się o 08:00 i 14:00 (możesz dostosować godziny)
    - cron: '0 8,14 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: 1. Uruchomienie Silnika (Pobieranie, modele i tworzenie pakietów AKO)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python betexplorer_all.py

      - name: 2. Natychmiastowa wysyłka gotowych AKO na Telegram
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wyslij_kupon.py
